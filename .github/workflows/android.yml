name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/keystore.jks
            echo "Keystore decoded."
          else
            echo "No KEYSTORE_B64 secret set - using default debug key."
          fi
      - name: Build debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KS_STORE_PASS: ${{ secrets.KS_STORE_PASS }}
          KS_KEY_PASS: ${{ secrets.KS_KEY_PASS }}
          KS_KEY_ALIAS: kameratv
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Prepare update files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/app-debug.apk
          printf '{\n  "versionCode": %s,\n  "versionName": "2.0",\n  "apkUrl": "https://github.com/zvrkavac/moje-kamere/releases/latest/download/app-debug.apk",\n  "notes": "Nova verzija aplikacije Moje Kamere."\n}\n' "${{ github.run_number }}" > out/version.json
          cat out/version.json
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Moje Kamere (build ${{ github.run_number }})
          files: |
            out/app-debug.apk
            out/version.json
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MojeKamere-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
