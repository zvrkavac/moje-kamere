plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rame.kameratv'
    compileSdk 34

    signingConfigs {
        appkey {
            storeFile file("keystore.jks")
            storePassword System.getenv("KS_STORE_PASS") ?: ""
            keyAlias System.getenv("KS_KEY_ALIAS") ?: "kameratv"
            keyPassword System.getenv("KS_KEY_PASS") ?: ""
        }
    }

    defaultConfig {
        applicationId "com.rame.kameratv"
        minSdk 21
        targetSdk 34
        versionCode ((System.getenv("VERSION_CODE") ?: "1") as int)
        versionName "2.3"

        // libVLC ships native libraries; limit to common Android TV ABIs to keep APK size down.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            if (file("keystore.jks").exists()) {
                signingConfig signingConfigs.appkey
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (file("keystore.jks").exists()) {
                signingConfig signingConfigs.appkey
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-opt-in=androidx.media3.common.util.UnstableApi']
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'

    implementation 'com.google.zxing:core:3.5.3'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // libVLC: used only to record RTSP streams to a file (Media3 cannot record).
    implementation 'org.videolan.android:libvlc-all:3.6.0'
}
